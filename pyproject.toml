[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scenemedic"
version = "0.1.0"
description = "Physician-built multi-agent clinical-realism advisor for medical film & TV."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmed Zayed" }]
dependencies = [
    "google-cloud-aiplatform[agent_engines,adk]>=1.101.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-documentai>=2.29.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-genai>=1.0.0",
    "google-auth>=2.29",
    "clickhouse-connect>=0.7.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0.1",
    "streamlit>=1.36",
    "pypdf>=4.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "deploy", "corpus", "ui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
